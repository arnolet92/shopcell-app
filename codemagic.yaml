workflows:
  ios-unsigned:
    name: ShopCell iOS (build seul, sans signature)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Récupérer les dépendances Flutter
        script: flutter pub get
      - name: Compiler pour iOS (sans signature)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  ios-release:
    name: ShopCell iOS (signé + TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        APP_STORE_APPLE_ID: 6802244455
        BUNDLE_ID: com.shopcell.shopcell
    scripts:
      - name: Récupérer les dépendances Flutter
        script: flutter pub get
      - name: Configurer la signature automatique (certificats + profils)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compiler et signer l'IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: api_key
        submit_to_testflight: true
        submit_to_app_store: false
