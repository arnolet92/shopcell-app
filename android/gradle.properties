# Réduit par rapport au défaut du template (8G) : cette machine a 15G de RAM
# au total, et R8 (utilisé même sans minification en release) a fait planter
# le daemon Gradle par manque de mémoire native avec un tas de 8G.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# Contournement d'un bug connu du compilateur Kotlin sous Windows quand le
# projet et le cache Gradle/Pub ne sont pas sur le même lecteur (ex: D:\ vs
# C:\...) : FileToPathConverter.relativeTo() lève "different roots" pendant
# la compilation incrémentale. Désactiver l'incrémental évite le crash.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
